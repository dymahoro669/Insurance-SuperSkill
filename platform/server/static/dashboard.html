<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance-SuperSkill Platform Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
  .card h2 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 32px; font-weight: 700; color: #f8fafc; }
  .card .sub { font-size: 12px; color: #64748b; margin-top: 4px; }
  .green { color: #4ade80; }
  .red { color: #f87171; }
  .yellow { color: #facc15; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 600; }
  .bar { height: 6px; background: #334155; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar-fill { height: 100%; background: #38bdf8; border-radius: 3px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-pass { background: #14532d; color: #4ade80; }
  .badge-warn { background: #713f12; color: #facc15; }
  .badge-fail { background: #7f1d1d; color: #f87171; }
  .badge-pending { background: #1e3a5f; color: #38bdf8; }
  .refresh { position: fixed; top: 20px; right: 20px; background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .refresh:hover { background: #7dd3fc; }
</style>
</head>
<body>
<h1>Insurance-SuperSkill Platform</h1>
<button class="refresh" onclick="loadAll()">Refresh</button>

<div class="grid" id="metrics">
  <div class="card"><h2>总调用量</h2><div class="value" id="total-inv">-</div></div>
  <div class="card"><h2>平均响应</h2><div class="value" id="avg-dur">-</div><div class="sub">ms</div></div>
  <div class="card"><h2>通过率</h2><div class="value green" id="pass-rate">-</div></div>
  <div class="card"><h2>失败率</h2><div class="value red" id="fail-rate">-</div></div>
</div>

<div class="grid">
  <div class="card" style="grid-column: span 2;">
    <h2>Skill 质量排行榜 (24h)</h2>
    <table>
      <thead><tr><th>Skill</th><th>调用</th><th>通过</th><th>平均分</th><th>趋势</th></tr></thead>
      <tbody id="skill-rank"></tbody>
    </table>
  </div>
  <div class="card">
    <h2>进化计划</h2>
    <table>
      <thead><tr><th>计划</th><th>状态</th></tr></thead>
      <tbody id="evolution-plans"></tbody>
    </table>
  </div>
</div>

<div class="grid">
  <div class="card" style="grid-column: span 2;">
    <h2>最近事件</h2>
    <table>
      <thead><tr><th>时间</th><th>Skill</th><th>得分</th><th>判定</th><th>耗时</th></tr></thead>
      <tbody id="recent-events"></tbody>
    </table>
  </div>
  <div class="card">
    <h2>审计报告</h2>
    <table>
      <thead><tr><th>ID</th><th>得分</th><th>判定</th></tr></thead>
      <tbody id="audit-reports"></tbody>
    </table>
  </div>
</div>

<script>
const API = '';
function fmt(n) { return n === undefined || n === null ? '-' : n; }
function badge(v) {
  const cls = v === 'pass' ? 'badge-pass' : v === 'warn' ? 'badge-warn' : v === 'fail' ? 'badge-fail' : 'badge-pending';
  return `<span class="badge ${cls}">${v.toUpperCase()}</span>`;
}

async function loadMetrics() {
  const r = await fetch(API + '/api/v1/telemetry/metrics?period=24h');
  const d = await r.json();
  document.getElementById('total-inv').textContent = fmt(d.invocations);
  document.getElementById('pass-rate').textContent = fmt(d.pass_rate);
  document.getElementById('fail-rate').textContent = fmt(d.fail_rate);

  let rank = '';
  for (const [sid, m] of Object.entries(d.skills || {})) {
    rank += `<tr><td>${sid}</td><td>${m.invocations}</td><td>${Math.round(m.pass_rate*100)}%</td><td>${m.avg_score}</td><td>${m.avg_duration_ms}ms</td></tr>`;
  }
  document.getElementById('skill-rank').innerHTML = rank || '<tr><td colspan="5" style="color:#64748b">No data</td></tr>';
}

async function loadEvents() {
  const r = await fetch(API + '/api/v1/telemetry/events?limit=10');
  const d = await r.json();
  let rows = '';
  for (const e of d.events || []) {
    rows += `<tr><td>${new Date(e.timestamp).toLocaleTimeString()}</td><td>${e.skill}</td><td>${e.l1_score}</td><td>${badge(e.l1_verdict)}</td><td>${e.duration_ms}ms</td></tr>`;
  }
  document.getElementById('recent-events').innerHTML = rows || '<tr><td colspan="5" style="color:#64748b">No data</td></tr>';
}

async function loadEvolution() {
  const r = await fetch(API + '/api/v1/evolution/plans');
  const d = await r.json();
  let rows = '';
  for (const p of d.plans || []) {
    rows += `<tr><td>${p.plan_id}</td><td>${badge(p.status)}</td></tr>`;
  }
  document.getElementById('evolution-plans').innerHTML = rows || '<tr><td colspan="2" style="color:#64748b">No data</td></tr>';
}

async function loadAudits() {
  const r = await fetch(API + '/api/v1/auditor/reports');
  const d = await r.json();
  let rows = '';
  for (const a of d.reports || []) {
    rows += `<tr><td>${a.audit_id}</td><td>${a.total_score}</td><td>${badge(a.verdict)}</td></tr>`;
  }
  document.getElementById('audit-reports').innerHTML = rows || '<tr><td colspan="3" style="color:#64748b">No data</td></tr>';
}

function loadAll() {
  loadMetrics();
  loadEvents();
  loadEvolution();
  loadAudits();
}
loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
